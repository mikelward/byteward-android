name: Byteward release

# Builds a signed release APK and Play Store bundle (AAB) and attaches them to
# a GitHub release.
#
# Runs when a tag like v2026.11.0-1 is pushed, or by hand from the Actions tab.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   BYTEWARD_KEYSTORE_BASE64  The release keystore, base64-encoded
#   BYTEWARD_KEYSTORE_PASSWORD
#   BYTEWARD_KEY_ALIAS
#   BYTEWARD_KEY_PASSWORD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version-name:
        description: "Version name, e.g. 2026.11.0-1 (defaults to the one in libs.versions.toml)"
        required: false

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.BYTEWARD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::BYTEWARD_KEYSTORE_BASE64 is not set. See the comment at the top of this workflow."
            exit 1
          fi

      - name: Setup Android Build
        uses: ./.github/actions/setup-android-build

      - name: Set version
        env:
          INPUT_VERSION: ${{ inputs.version-name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION_NAME="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION_NAME="${REF_NAME#v}"
          else
            VERSION_NAME=$(sed -n 's/^appVersionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          fi
          # Play needs a version code that always goes up; the run number does.
          VERSION_CODE=$((100000 + RUN_NUMBER))
          sed -i "s/^appVersionName = .*/appVersionName = \"$VERSION_NAME\"/" gradle/libs.versions.toml
          sed -i "s/^appVersionCode = .*/appVersionCode = \"$VERSION_CODE\"/" gradle/libs.versions.toml
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Version $VERSION_NAME ($VERSION_CODE)"

      - name: Build release APK and bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleStandardRelease :app:bundleStandardRelease

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.BYTEWARD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BYTEWARD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BYTEWARD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BYTEWARD_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p dist

          APK=$(find app/build/outputs/apk/standard/release -name '*.apk' | head -1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "dist/byteward-$VERSION_NAME.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "dist/byteward-$VERSION_NAME.apk"

          AAB=$(find app/build/outputs/bundle -path '*standardRelease*' -name '*.aab' | head -1)
          cp "$AAB" "dist/byteward-$VERSION_NAME.aab"
          jarsigner -keystore "$KEYSTORE" -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD "dist/byteward-$VERSION_NAME.aab" "$KEY_ALIAS"

          rm -f "$KEYSTORE"
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byteward-android-${{ env.VERSION_NAME }}
          path: dist/

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Byteward for Android $VERSION_NAME" \
            --generate-notes
