name: Byteward build

# Builds a debug APK for every pull request and push to main, so changes can be
# installed and tried on a phone. Debug builds use the debug keystore checked
# into the repo and install alongside the release app (".dev" package suffix).

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Android Build
        uses: ./.github/actions/setup-android-build

      - name: Build debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleStandardDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byteward-android-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
