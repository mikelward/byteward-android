name: ci

# Byteward's own CI, alongside upstream's test.yml (unit tests and lint), which
# is kept as it is so upstream merges stay clean.
#
# Builds a debug APK for every pull request and push to main and uploads it as
# an artifact, so a change can be installed and tried on a phone. Debug builds
# use the debug keystore checked into the repo and install alongside the
# release app (they carry a ".dev" package suffix).
on:
  push:
    branches: [main]
  pull_request:
    # No paths filter, deliberately: the ruleset requires the `lanes` check,
    # and a required check that never reports blocks the pull request forever.
    # Documentation-only pull requests skip the build via `classify` instead,
    # and `lanes` verifies the skip was justified.
    #
    # `edited` is load-bearing: a retarget changes what the diff is measured
    # against while the head -- and any `lanes` check already on it -- stays
    # put, so a base change must start a fresh run.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Nothing here writes to the repository. `packages: read` is for the Bitwarden
# SDK, which Gradle downloads from GitHub Packages with the workflow token.
permissions:
  contents: read
  pull-requests: read
  packages: read

jobs:
  # Decides whether the build may skip: true only when every changed file is
  # documentation (see .github/lanes.conf; the engine is mikelward/lanes).
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          # This job runs `./gradlew`, so anything left in .git/config is
          # readable by a build script or a plugin.
          persist-credentials: false

      # Upstream's composite setup: JDK, Gradle, Ruby and the Android NDK.
      - name: Setup Android Build
        uses: ./.github/actions/setup-android-build

      - name: Build debug APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :app:assembleStandardDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: byteward-android-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

  # The check the ruleset requires from this workflow. Always runs, always
  # reports: green only when the build succeeded, or when it was skipped and
  # the skip is independently verified as justified.
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, build]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          base-sha: ${{ needs.classify.outputs.base_sha }}
          classify-result: ${{ needs.classify.result }}
          results: >-
            build=${{ needs.build.result }}
